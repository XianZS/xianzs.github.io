<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>XianZS</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="XianZS的个人站点">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@latest/lib/themes/vue.css">
</head>

<body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            name: 'XianZS',
            repo: 'https://github.com/XianZS/PythonLearning',
            loadSidebar: true,
            loadNavbar: true,
            subMaxLevel: 2,
            auto2top: true,
            search: {
                placeholder: '搜索',
                noData: '没有结果',
                paths: 'auto'
            },
            sidebarDisplayLevel: 1
        }
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@latest"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@latest"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@latest"></script>
</body>

</html>
